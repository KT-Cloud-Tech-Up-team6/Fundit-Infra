name: "Terraform CD (Main Apply)"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-cd.yml"

permissions:
  id-token: write
  contents: read

jobs:
  filter:
    name: "Detect Changed Layers"
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.changes.outputs.changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bootstrap:
              - 'terraform/envs/bootstrap/**'
              - 'terraform/modules/ecr/**'
            network:
              - 'terraform/envs/dev/01-network/**'
              - 'terraform/modules/vpc/**'
              - 'terraform/modules/nat-instance/**'
              - 'terraform/modules/vpc-endpoints/**'
            storage:
              - 'terraform/envs/dev/04-storage/**'
              - 'terraform/modules/s3/**'
            gateway:
              - 'terraform/envs/dev/02-gateway/**'
              - 'terraform/modules/waf/**'
              - 'terraform/modules/cloudfront/**'
              - 'terraform/modules/route53-acm/**'
              - 'terraform/modules/alb/**'
            compute:
              - 'terraform/envs/dev/03-compute/**'
              - 'terraform/modules/ec2/**'
              - 'terraform/modules/security-groups/**'
            eks:
              - 'terraform/envs/dev/05-eks/**'
              - 'terraform/modules/eks/**'
            karpenter:
              - 'terraform/envs/dev/06-karpenter/**'
              - 'terraform/modules/karpenter/**'
            keda:
              - 'terraform/envs/dev/07-keda/**'
            cnpg:
              - 'terraform/envs/dev/08-cnpg/**'
              - 'terraform/modules/cnpg/**'
            argocd:
              - 'terraform/envs/dev/09-argocd/**'
            monitoring:
              - 'terraform/envs/dev/10-monitoring/**'
            lbc:
              - 'terraform/envs/dev/11-load-balancer-controller/**'
              - 'terraform/modules/aws-load-balancer-controller/**'
            kafka:
              - 'terraform/envs/dev/12-kafka/**'
            irsa_backend:
              - 'terraform/envs/dev/14-irsa-backend/**'
            external_secrets:
              - 'terraform/envs/dev/15-external-secrets/**'

  apply:
    name: "Terraform Apply"
    needs: filter
    if: ${{ needs.filter.outputs.layers != '[]' && needs.filter.outputs.layers != '' }}
    runs-on: ubuntu-latest
    environment: dev-apply
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::899957568205:role/fundit-terraform-ci-role
          aws-region: ap-northeast-2

      - name: Setup AWS Profile for team6-infra
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile team6-infra
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile team6-infra
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile team6-infra
          aws configure set region "ap-northeast-2" --profile team6-infra

      - name: Apply Changed Layers Sequentially
        run: |
          ORDERED_LAYERS=(
            "bootstrap:terraform/envs/bootstrap"
            "network:terraform/envs/dev/01-network"
            "storage:terraform/envs/dev/04-storage"
            "gateway:terraform/envs/dev/02-gateway"
            "compute:terraform/envs/dev/03-compute"
            "eks:terraform/envs/dev/05-eks"
            "karpenter:terraform/envs/dev/06-karpenter"
            "keda:terraform/envs/dev/07-keda"
            "cnpg:terraform/envs/dev/08-cnpg"
            "argocd:terraform/envs/dev/09-argocd"
            "monitoring:terraform/envs/dev/10-monitoring"
            "lbc:terraform/envs/dev/11-load-balancer-controller"
            "kafka:terraform/envs/dev/12-kafka"
            "irsa_backend:terraform/envs/dev/14-irsa-backend"
            "external_secrets:terraform/envs/dev/15-external-secrets"
          )

          CHANGED='${{ needs.filter.outputs.layers }}'
          echo "Changed layers JSON: $CHANGED"

          for entry in "${ORDERED_LAYERS[@]}"; do
            KEY="${entry%%:*}"
            DIR="${entry##*:}"

            if echo "$CHANGED" | grep -q "\"$KEY\""; then
              echo "=========================================="
              echo "Applying layer: $KEY ($DIR)"
              echo "=========================================="
              cd "$GITHUB_WORKSPACE/$DIR"
              terraform init
              terraform apply -auto-approve
            fi
          done

      - name: Checkout Fundit-GitOps
        if: contains(fromJSON(needs.filter.outputs.layers), 'argocd')
        uses: actions/checkout@v4
        with:
          repository: KT-Cloud-Tech-Up-team6/Fundit-GitOps
          ref: main
          path: Fundit-GitOps
          persist-credentials: false

      - name: Setup kubectl
        if: contains(fromJSON(needs.filter.outputs.layers), 'argocd')
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"

      - name: Configure kubectl for dev EKS
        if: contains(fromJSON(needs.filter.outputs.layers), 'argocd')
        run: |
          aws eks update-kubeconfig \
            --name fundit-dev-eks \
            --region ap-northeast-2

      - name: Wait for Argo CD controllers
        if: contains(fromJSON(needs.filter.outputs.layers), 'argocd')
        run: |
          kubectl wait \
            --for=condition=Established \
            --timeout=180s \
            crd/applications.argoproj.io \
            crd/appprojects.argoproj.io

          kubectl rollout status \
            --namespace argocd \
            --timeout=300s \
            statefulset/argocd-application-controller

          kubectl rollout status \
            --namespace argocd \
            --timeout=300s \
            deployment/argocd-repo-server

      - name: Bootstrap Fundit GitOps root application
        if: contains(fromJSON(needs.filter.outputs.layers), 'argocd')
        run: kubectl apply -f "$GITHUB_WORKSPACE/Fundit-GitOps/root.yaml"

      - name: Verify Argo CD application chain
        if: contains(fromJSON(needs.filter.outputs.layers), 'argocd')
        run: |
          kubectl wait \
            --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            --timeout=600s \
            application/fundit-root

          kubectl wait \
            --namespace argocd \
            --for=create \
            --timeout=300s \
            application/fundit-dev

          kubectl wait \
            --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            --timeout=600s \
            application/fundit-dev

          kubectl wait \
            --namespace argocd \
            --for=jsonpath='{.status.health.status}'=Healthy \
            --timeout=600s \
            application/fundit-dev

          kubectl get applications.argoproj.io \
            --namespace argocd \
            fundit-root fundit-dev \
            -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status'
