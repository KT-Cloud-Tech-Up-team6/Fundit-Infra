name: "Dev Infrastructure Sleep Schedule"

on:
  schedule:
    # 평일(월~금) 21:00 KST (12:00 UTC) -> 절전 모드 실행
    - cron: '0 12 * * 1-5'
    # 평일(월~금) 08:30 KST = 일~목 23:30 UTC -> 기상 모드 실행
    - cron: '30 23 * * 0-4'

  workflow_dispatch:
    inputs:
      action:
        description: "실행할 동작을 선택하세요"
        required: true
        default: "sleep"
        type: choice
        options:
          - sleep
          - wakeup

permissions:
  id-token: write
  contents: read

jobs:
  schedule-action:
    name: "Execute Sleep / Wakeup"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-northeast-2"
      CLUSTER_NAME: "fundit-dev-eks"
      NODEGROUP_NAME: "fundit-dev-system-ng"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Action
        id: determine_action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
            echo "Triggered manually via workflow_dispatch with action: $ACTION"
          else
            # 스케줄 트리거: 현재 UTC 시간에 따라 절전/기상 자동 판별
            CURRENT_HOUR=$(date -u +%H)
            echo "Current UTC hour: $CURRENT_HOUR"
            if [ "$CURRENT_HOUR" -ge 10 ] && [ "$CURRENT_HOUR" -le 15 ]; then
              ACTION="sleep"
            else
              ACTION="wakeup"
            fi
            echo "Triggered via schedule. Inferred action: $ACTION"
          fi
          echo "action=$ACTION" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::899957568205:role/fundit-terraform-ci-role
          aws-region: ap-northeast-2

      # ====================================================
      # 1. 절전 모드 (Sleep): EKS 축소 -> EC2 중지 -> NAT 인스턴스 중지
      # ====================================================
      - name: Execute Sleep Sequence
        if: steps.determine_action.outputs.action == 'sleep'
        run: |
          echo "=========================================="
          echo "[SLEEP] Starting Cost Optimization Sequence"
          echo "=========================================="

          # 1. EKS 시스템 노드 그룹 축소 (2대 -> 1대, Karpenter 컨트롤러 상시 보호)
          echo "[Step 1/3] Scaling down EKS system nodegroup ($NODEGROUP_NAME)..."
          CURRENT_DESIRED=$(aws eks describe-nodegroup \
            --cluster-name "$CLUSTER_NAME" \
            --nodegroup-name "$NODEGROUP_NAME" \
            --query "nodegroup.scalingConfig.desiredSize" \
            --output text 2>/dev/null || echo "0")
          
          echo "Current desired size: $CURRENT_DESIRED"
          if [ "$CURRENT_DESIRED" -gt 1 ]; then
            aws eks update-nodegroup-config \
              --cluster-name "$CLUSTER_NAME" \
              --nodegroup-name "$NODEGROUP_NAME" \
              --scaling-config minSize=1,desiredSize=1
            echo "EKS nodegroup update initiated (min: 1, desired: 1)."
          else
            echo "EKS nodegroup already at desiredSize <= 1. Skipping scale down."
          fi

          # 2. 개발용 EC2 인스턴스 중지
          echo "[Step 2/3] Stopping Development App EC2 instances..."
          APP_INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=fundit-dev-app-ec2" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -n "$APP_INSTANCE_IDS" ]; then
            echo "Found running App EC2: $APP_INSTANCE_IDS. Stopping..."
            aws ec2 stop-instances --instance-ids $APP_INSTANCE_IDS
          else
            echo "No running App EC2 found."
          fi

          # 3. NAT 인스턴스 중지 (2 AZ)
          echo "[Step 3/3] Stopping NAT instances..."
          NAT_INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=fundit-dev-nat-*" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -n "$NAT_INSTANCE_IDS" ]; then
            echo "Found running NAT instances: $NAT_INSTANCE_IDS. Stopping..."
            aws ec2 stop-instances --instance-ids $NAT_INSTANCE_IDS
          else
            echo "No running NAT instances found."
          fi

          echo "=========================================="
          echo "[SLEEP] Completed successfully."
          echo "=========================================="

      # ====================================================
      # 2. 기상 모드 (Wakeup): NAT 시작 -> Running 대기 -> EC2 시작 -> EKS 노드 그룹 복구
      # ====================================================
      - name: Execute Wakeup Sequence
        if: steps.determine_action.outputs.action == 'wakeup'
        run: |
          echo "=========================================="
          echo "[WAKEUP] Starting Infrastructure Recovery Sequence"
          echo "=========================================="

          # 1. NAT 인스턴스 시작 (Egress 인터넷 경로 확보)
          echo "[Step 1/4] Starting NAT instances..."
          NAT_INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=fundit-dev-nat-*" "Name=instance-state-name,Values=stopped" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          ALL_NAT_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=fundit-dev-nat-*" "Name=instance-state-name,Values=running,stopped,pending" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -n "$NAT_INSTANCE_IDS" ]; then
            echo "Starting stopped NAT instances: $NAT_INSTANCE_IDS..."
            aws ec2 start-instances --instance-ids $NAT_INSTANCE_IDS
          else
            echo "NAT instances are already running or not in stopped state."
          fi

          # 2. NAT 인스턴스가 완전히 Running 상태가 될 때까지 대기
          if [ -n "$ALL_NAT_IDS" ]; then
            echo "[Step 2/4] Waiting for NAT instances to reach 'running' state..."
            aws ec2 wait instance-running --instance-ids $ALL_NAT_IDS
            echo "NAT instances are now running and healthy."
          fi

          # 3. 개발용 EC2 인스턴스 시작
          echo "[Step 3/4] Starting Development App EC2..."
          APP_INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=fundit-dev-app-ec2" "Name=instance-state-name,Values=stopped" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -n "$APP_INSTANCE_IDS" ]; then
            echo "Starting stopped App EC2: $APP_INSTANCE_IDS..."
            aws ec2 start-instances --instance-ids $APP_INSTANCE_IDS
          else
            echo "App EC2 is already running or not in stopped state."
          fi

          # 4. EKS 시스템 노드 그룹 복구 (1대 -> 2대)
          echo "[Step 4/4] Scaling up EKS system nodegroup ($NODEGROUP_NAME) to 2 nodes..."
          CURRENT_DESIRED=$(aws eks describe-nodegroup \
            --cluster-name "$CLUSTER_NAME" \
            --nodegroup-name "$NODEGROUP_NAME" \
            --query "nodegroup.scalingConfig.desiredSize" \
            --output text 2>/dev/null || echo "0")
          
          echo "Current desired size: $CURRENT_DESIRED"
          if [ "$CURRENT_DESIRED" -lt 2 ]; then
            aws eks update-nodegroup-config \
              --cluster-name "$CLUSTER_NAME" \
              --nodegroup-name "$NODEGROUP_NAME" \
              --scaling-config minSize=2,desiredSize=2
            echo "EKS nodegroup recovery initiated (min: 2, desired: 2)."
          else
            echo "EKS nodegroup already at desiredSize >= 2."
          fi

          echo "=========================================="
          echo "[WAKEUP] Completed successfully."
          echo "=========================================="
